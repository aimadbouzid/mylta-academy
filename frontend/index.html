<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-128.png" />

    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="/logo-wordmark.png" fetchpriority="high" />
    <link rel="alternate icon" href="/pwa-192x192.png" />

    <!-- PWA — Apple (iOS) -->
    <link rel="apple-touch-icon" href="/logo-256.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mylta Academy">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- PWA — Android / Chrome -->
    <meta name="theme-color" content="#f1f5f7">

    <!-- Polices Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Les graisses chargées sont celles réellement employées : Archivo 500,
         600 et 800 et Inter 300 n'étaient utilisées nulle part et coûtaient
         quatre fichiers de police au premier affichage.
         Archivo pour les titres, Inter pour le texte courant. Les titres
         réclamaient un 900 qu'Inter ne fournissait pas : le navigateur
         fabriquait un faux gras, d'où ce rendu un peu mou et sans caractère.
         Archivo monte réellement jusqu'à 900 et a le dessin large et net des
         affiches d'évènement — le même registre que le billet. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- SEO de base (enrichi dynamiquement par SEOHead via react-helmet-async) -->
    <title>Mylta Academy | Formation Premium sur Smartphone & Outils de Réussite</title>
    <meta
      name="description"
      content="Mylta Academy — La plateforme e-learning 100% accessible sur smartphone en Algérie. Formations pratiques, outils IA et business depuis votre téléphone."
    />
    <!-- Vérification de propriété — Google Search Console & Bing Webmaster.
         Étape indispensable pour que le site soit exploré puis indexé par
         Google : sans elle, impossible de soumettre le sitemap généré par
         backend/routes/seo.js (SITE_URL/sitemap.xml).
         Marche à suivre :
           1. https://search.google.com/search-console → Ajouter une propriété
              → méthode "Balise HTML" → copier le code fourni (content="...")
           2. Le coller ci-dessous, décommenter la balise, redéployer
           3. Une fois le site vérifié : menu Sitemaps → soumettre
              "sitemap.xml" → Google explore alors les pages une à une
         Même procédure sur https://www.bing.com/webmasters. -->
    <!-- <meta name="google-site-verification" content="VOTRE_CODE_ICI" /> -->
    <!-- <meta name="msvalidate.01" content="VOTRE_CODE_BING_ICI" /> -->

    <!-- Google Analytics (TODO: Remplacer G-XXXXXXXXXX par votre ID) -->

    <!-- Meta Pixel : volontairement absent d'index.html.
         Il est chargé par src/lib/facebookPixel.js UNIQUEMENT après acceptation
         des cookies, et l'ID vient de VITE_FACEBOOK_PIXEL_ID. Un snippet placé
         ici se déclencherait avant tout consentement, et ne compterait qu'une
         vue par session (la navigation SPA ne recharge pas la page). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
